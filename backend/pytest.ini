[pytest]
testpaths = tests
python_files = test_*.py
addopts = --strict-markers
asyncio_mode = strict
markers =
    PURE: self-contained tests that do not resolve the shared canonical application fixtures
    CANONICAL_DB: tests that use the complete ORM registry with isolated database or application fixtures
    c03_legal(mode): use the formally published C03 Source/Revision/RSA/Task fixture
